<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Us • Our Love Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Keeping Great Vibes for the romantic script title, and Playfair for elegant headings -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    /* RED COLOR PALETTE */
    --red-main: #D32F2F;       /* Crimson Red */
    --red-deep: #8B0000;       /* Dark Red */
    --red-light: #FFCDD2;      /* Soft Red */
    --red-bg: #FFF5F5;         /* Very pale red background */
    --gold: #C9A66B;           /* Gold accent */
    --ink: #2c0a0a;            /* Very dark red/black for text */
    --ink-soft: #7f4f4f;       /* Soft red-grey for secondary text */
    --glass: rgba(255, 255, 255, 0.65);
    --shadow: 0 10px 40px rgba(211, 47, 47, 0.15);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  
  /* SF PRO FONT STACK */
  body{
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, #ffe6e6 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #fff0f0 0%, transparent 55%),
      linear-gradient(180deg, #ffffff 0%, var(--red-bg) 100%);
    min-height:100vh;
    overflow-x:hidden;
    padding-bottom:60px;
  }

  .hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .hearts span{
    position:absolute;bottom:-40px;font-size:18px;color:var(--red-main);
    opacity:.4;animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) rotate(0);opacity:0}
    10%{opacity:.5}
    100%{transform:translateY(-110vh) rotate(360deg);opacity:0}
  }

  .app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:28px 18px}

  header{
    text-align:center;padding:22px 18px 18px;
    background:var(--glass);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.8);
    border-radius:24px;box-shadow:var(--shadow);
  }
  .script{font-family:'Great Vibes', cursive;font-size:48px;color:var(--red-deep);line-height:1}
  .names{font-family:'Playfair Display', serif;font-size:22px;letter-spacing:2px;margin-top:4px;color:var(--ink); font-weight: 600;}
  .counter{
    margin-top:14px;display:inline-flex;align-items:center;gap:10px;
    background:linear-gradient(135deg, var(--red-main), var(--red-deep));
    color:#fff;padding:10px 18px;border-radius:999px;
    font-size:13px;letter-spacing:1px;text-transform:uppercase;
    box-shadow:0 6px 20px rgba(211, 47, 47, 0.35);
  }
  .counter b{font-family:'Playfair Display', serif;font-size:20px;letter-spacing:0}

  .cal-nav{
    display:flex;align-items:center;justify-content:space-between;
    margin:22px 6px 10px;
  }
  .month-title{
    font-family:'Playfair Display', serif;font-size:26px;color:var(--ink);
  }
  .month-title em{font-style:italic;color:var(--red-main);font-weight:400}
  .nav-btn{
    width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
    background:#fff;color:var(--red-main);font-size:18px;
    box-shadow:0 4px 14px rgba(211, 47, 47, 0.15);
    transition:transform .2s ease, background .2s ease;
  }
  .nav-btn:hover{transform:scale(1.08);background:var(--red-bg)}

  .cal{
    background:var(--glass);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.6);
    border-radius:24px;box-shadow:var(--shadow);
    padding:14px;
  }
  .weekdays{
    display:grid;grid-template-columns:repeat(7,1fr);
    text-align:center;font-size:11px;letter-spacing:2px;
    color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;
    font-weight: 600;
  }
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .day{
    aspect-ratio:1/1;border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#fff;color:var(--ink);font-weight:500;font-size:15px;
    position:relative;cursor:default;
    transition:transform .2s ease, box-shadow .2s ease;
    border:1px solid rgba(211, 47, 47, 0.1);
  }
  .day.empty{background:transparent;border:none;cursor:default}
  .day.today{outline:2px dashed var(--gold);outline-offset:-4px}
  .day.special{
    background:linear-gradient(135deg,#fff 0%, #ffe6e6 100%);
    color:var(--red-deep);font-weight:600;cursor:pointer;
    box-shadow:0 6px 18px rgba(211, 47, 47, 0.25);
  }
  .day.special:hover{transform:translateY(-3px) scale(1.04)}
  .day.special::after{
    content:"♥";position:absolute;top:4px;right:6px;
    font-size:10px;color:var(--red-main);
  }
  .day .dot{
    position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
    font-size:9px;color:var(--gold);letter-spacing:2px;
  }

  .footer-note{
    text-align:center;margin-top:22px;
    font-family:'Playfair Display', serif;font-style:italic;
    color:var(--ink-soft);font-size:14px;
  }
  
  .manage-btn{
    display:block;margin:20px auto 0;padding:10px 24px;
    background:transparent;border:1px solid var(--red-main);
    color:var(--red-main);border-radius:999px;cursor:pointer;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    font-size:13px;font-weight: 600; letter-spacing:1px;
    transition:all .3s ease;
  }
  .manage-btn:hover{background:var(--red-main);color:#fff}

  .modal{
    position:fixed;inset:0;background:rgba(44, 10, 10, 0.5);
    display:none;align-items:center;justify-content:center;
    z-index:10;padding:16px;backdrop-filter:blur(6px);
  }
  .modal.open{display:flex;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  
  .card{
    background:linear-gradient(180deg,#fff 0%, var(--red-bg) 100%);
    border-radius:24px;max-width:520px;width:100%;
    max-height:90vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(139, 0, 0, 0.25);
    border:1px solid rgba(255,255,255,.8);
    animation:pop .35s cubic-bezier(.2,.8,.2,1.2);
  }
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .card-head{
    padding:22px 22px 10px;text-align:center;position:relative;
  }
  .card-date{
    font-family:'Great Vibes', cursive;font-size:34px;color:var(--red-deep);
  }
  .card-title{
    font-family:'Playfair Display', serif;font-size:18px;color:var(--ink);
    margin-top:2px; font-weight: 600;
  }
  .close{
    position:absolute;top:14px;right:14px;
    width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
    background:#fff;color:var(--red-main);font-size:18px;
    box-shadow:0 4px 12px rgba(211, 47, 47, 0.2);
  }
  .gallery{
    display:grid;grid-template-columns:repeat(2,1fr);gap:8px;
    padding:10px 18px;
  }
  .gallery img{
    width:100%;height:140px;object-fit:cover;border-radius:14px;
    border:3px solid #fff;box-shadow:0 6px 16px rgba(211, 47, 47, 0.15);
    transition:transform .3s ease;
  }
  .gallery img:hover{transform:scale(1.04)}
  
  /* SF PRO FONT FOR THE QUOTE IMAGE */
  .memory{
    padding:10px 22px 22px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    font-style: italic;
    font-weight: 400;
    color:var(--ink);text-align:center;line-height:1.6;
    font-size: 16px;
  }
  .memory::before{content:"“ ";color:var(--red-main);font-size:24px; font-family: serif;}
  .memory::after{content:" ”";color:var(--red-main);font-size:24px; font-family: serif;}

  .editor-card{
    background:linear-gradient(180deg,#fff 0%, var(--red-bg) 100%);
    border-radius:24px;max-width:600px;width:100%;
    max-height:90vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(139, 0, 0, 0.25);
    border:1px solid rgba(255,255,255,.8);
    animation:pop .35s cubic-bezier(.2,.8,.2,1.2);
    padding:24px;
  }
  .editor-title{
    font-family:'Great Vibes', cursive;font-size:36px;color:var(--red-deep);
    text-align:center;margin-bottom:20px;
  }
  .form-group{margin-bottom:16px}
  .form-group label{
    display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:6px;font-weight:600;
  }
  .form-group input, .form-group textarea{
    width:100%;padding:12px 16px;border-radius:12px;
    border:1px solid rgba(211, 47, 47, 0.3);
    background:rgba(255,255,255,.8);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    font-size:15px;color:var(--ink);
    outline:none;transition:border .2s;
  }
  .form-group input:focus, .form-group textarea:focus{
    border-color:var(--red-main);background:#fff;
  }
  .form-group textarea{resize:vertical;min-height:80px; font-style: italic;}
  
  .file-label{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:14px;border:2px dashed var(--red-light);border-radius:12px;
    color:var(--red-main);cursor:pointer;font-size:14px; font-weight: 500;
    transition:background .2s;
  }
  .file-label:hover{background:rgba(211, 47, 47, 0.05)}
  .file-label input{display:none}

  .btn-row{display:flex;gap:10px;margin-top:20px}
  .btn{
    flex:1;padding:14px;border:none;border-radius:12px;cursor:pointer;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    font-size:14px;font-weight:600;letter-spacing:0.5px;
    transition:transform .2s, box-shadow .2s;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{
    background:linear-gradient(135deg, var(--red-main), var(--red-deep));
    color:#fff;box-shadow:0 6px 20px rgba(211, 47, 47, 0.35);
  }
  .btn-secondary{
    background:#fff;color:var(--red-main);border:1px solid var(--red-light);
  }

  .existing-list{margin-top:24px;border-top:1px solid rgba(211, 47, 47, 0.2);padding-top:16px}
  .existing-list h3{
    font-family:'Playfair Display', serif;font-size:18px;color:var(--ink);
    margin-bottom:12px;text-align:center;
  }
  .mem-item{
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,.7);padding:12px 16px;border-radius:12px;
    margin-bottom:8px;border:1px solid rgba(211, 47, 47, 0.1);
  }
  .mem-item-info{font-size:14px}
  .mem-item-info b{color:var(--red-deep);font-family:'Playfair Display', serif;font-size:16px}
  .mem-item-info span{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}
  .del-btn{
    background:none;border:none;color:var(--red-main);cursor:pointer;
    font-size:18px;padding:4px 8px;opacity:.6;transition:opacity .2s;
  }
  .del-btn:hover{opacity:1}

  /* MAP SECTION */
  .map-section{
    margin-top:30px;
    background:var(--glass);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.6);
    border-radius:24px;box-shadow:var(--shadow);
    padding:20px;
  }
  .map-title{
    font-family:'Great Vibes', cursive;font-size:32px;color:var(--red-deep);
    text-align:center;margin-bottom:16px;
  }
  .map-container{
    height:300px;border-radius:16px;overflow:hidden;
    border:3px solid #fff;box-shadow:0 6px 20px rgba(211, 47, 47, 0.15);
  }
  .distance-display{
    text-align:center;margin-top:16px;padding:16px;
    background:linear-gradient(135deg, rgba(211, 47, 47, 0.05), rgba(201, 166, 107, 0.1));
    border-radius:16px;border:1px solid rgba(211, 47, 47, 0.2);
  }
  .distance-label{
    font-size:12px;letter-spacing:2px;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:6px; font-weight: 600;
  }
  .distance-value{
    font-family:'Playfair Display', serif;font-size:28px;color:var(--red-deep);
    font-weight:600;
  }
  .distance-unit{
    font-size:16px;color:var(--ink-soft);margin-left:4px;
  }
  .location-btns{
    display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;
  }
  .loc-btn{
    flex:1;min-width:140px;padding:12px;border:none;border-radius:12px;
    cursor:pointer;font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    font-size:13px; font-weight: 600; letter-spacing:0.5px;transition:all .2s;
  }
  .loc-btn-primary{
    background:linear-gradient(135deg, var(--red-main), var(--red-deep));
    color:#fff;box-shadow:0 4px 14px rgba(211, 47, 47, 0.3);
  }
  .loc-btn-secondary{
    background:#fff;color:var(--red-main);border:1px solid var(--red-light);
  }
  .loc-btn:hover{transform:translateY(-2px)}
  .loc-btn:disabled{opacity:.5;cursor:not-allowed}

  .location-info{
    margin-top:16px;padding:14px;background:rgba(255,255,255,.6);
    border-radius:12px;font-size:13px;color:var(--ink-soft);
    text-align:center;line-height:1.6;
  }
  .location-info b{color:var(--red-deep)}
  
  .status-indicator{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    margin-right:6px;animation:pulse 2s infinite;
  }
  .status-online{background:#4ade80}
  .status-offline{background:#94a3b8}
  @keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:.5}
  }

  @media (max-width:480px){
    .script{font-size:36px}
    .names{font-size:18px}
    .month-title{font-size:20px}
    .day{font-size:13px;border-radius:10px}
    .gallery img{height:110px}
    .card-date{font-size:28px}
    .editor-card{padding:18px}
    .editor-title{font-size:30px}
    .map-container{height:250px}
    .distance-value{font-size:24px}
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="app">
  <header>
    <div class="script">Forever &amp; Always</div>
    <div class="names">Pathum  &nbsp;♥&nbsp; Malsha</div>
    <div class="counter">
      <span>Together for</span>
      <b id="daysCount">0</b>
      <span>beautiful days</span>
    </div>
  </header>

  <div class="cal-nav">
    <button class="nav-btn" id="prev">‹</button>
    <div class="month-title" id="monthTitle"></div>
    <button class="nav-btn" id="next">›</button>
  </div>

  <div class="cal">
    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
      <div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="days" id="days"></div>
  </div>

  <div class="footer-note">Every date with you is my favorite date.</div>
  
  <!-- MAP SECTION -->
  <div class="map-section">
    <div class="map-title">Where Our Hearts Are</div>
    <div class="map-container" id="map"></div>
    <div class="distance-display">
      <div class="distance-label">Distance Between Us</div>
      <div>
        <span class="distance-value" id="distanceValue">--</span>
        <span class="distance-unit" id="distanceUnit"></span>
      </div>
    </div>
    <div class="location-btns">
      <button class="loc-btn loc-btn-primary" id="joinRoom">💕 Join Love Room</button>
      <button class="loc-btn loc-btn-secondary" id="shareRoomCode">📤 Share Room Code</button>
    </div>
    <div class="location-info" id="locationInfo">
      Join a love room to track each other's location in real-time 💕
    </div>
  </div>
  
  <button class="manage-btn" id="openEditor">✎ Manage Memories</button>
</div>

<!-- Memory View Modal -->
<div class="modal" id="viewModal">
  <div class="card">
    <div class="card-head">
      <button class="close" onclick="closeModal('viewModal')">✕</button>
      <div class="card-date" id="cardDate"></div>
      <div class="card-title" id="cardTitle"></div>
    </div>
    <div class="gallery" id="gallery"></div>
    <div class="memory" id="memory"></div>
  </div>
</div>

<!-- Editor Modal -->
<div class="modal" id="editorModal">
  <div class="editor-card">
    <button class="close" onclick="closeModal('editorModal')">✕</button>
    <div class="editor-title">Add a Memory</div>
    
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="editDate">
    </div>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="editTitle" placeholder="e.g. Our First Date">
    </div>
    <div class="form-group">
      <label>Your Sweet Note</label>
      <textarea id="editMemory" placeholder="Write a beautiful memory..."></textarea>
    </div>
    <div class="form-group">
      <label>Photos</label>
      <label class="file-label">
        <span>📷 Tap to upload photos</span>
        <input type="file" id="editPhotos" multiple accept="image/*">
      </label>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="exportData()">Export Backup</button>
      <button class="btn btn-primary" id="saveMemory">Save Memory</button>
    </div>

    <div class="existing-list">
      <h3>Existing Memories</h3>
      <div id="memList"></div>
    </div>
  </div>
</div>

<!-- Room Code Modal -->
<div class="modal" id="roomModal">
  <div class="editor-card">
    <button class="close" onclick="closeModal('roomModal')">✕</button>
    <div class="editor-title">Join Love Room</div>
    <div class="form-group">
      <label>Room Code</label>
      <input type="text" id="roomCodeInput" placeholder="Enter room code from your partner" style="text-transform:uppercase">
    </div>
    <div class="form-group">
      <label>Your Name (optional)</label>
      <input type="text" id="userNameInput" placeholder="e.g. My Love">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="joinRoomBtn">Join Room</button>
    </div>
  </div>
</div>

let MEMORIES = {};
let map = null;
let myMarker = null;
let partnerMarker = null;
let distanceLine = null;
let watchId = null;
let currentRoom = null;
let userId = null;
let userName = 'Me';
let lastPartnerLoc = null;

function loadData() {
  const saved = localStorage.getItem('loveCalendarMemories');
  if (saved) {
    MEMORIES = JSON.parse(saved);
  } else {
    MEMORIES = { ...DEFAULT_MEMORIES };
    saveData();
  }
  
  const savedRoom = localStorage.getItem('currentRoom');
  if (savedRoom) {
    const roomData = JSON.parse(savedRoom);
    currentRoom = roomData.room;
    userId = roomData.userId;
    userName = roomData.userName || 'Me';
    startLocationTracking();
  }
}

function saveData() {
  try {
    localStorage.setItem('loveCalendarMemories', JSON.stringify(MEMORIES));
  } catch (e) {
    alert("Storage full! Try deleting some older photos to add new ones.");
  }
}

/* ============================================================
   CALENDAR RENDERING
============================================================ */
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];

let viewDate = new Date();
const today = new Date();

function pad(n){return n<10?"0"+n:n}
function key(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}

function render(){
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  document.getElementById('monthTitle').innerHTML = `${MONTHS[m]} <em>${y}</em>`;

  const firstDay = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const grid = document.getElementById('days');
  grid.innerHTML = '';

  for(let i=0;i<firstDay;i++){
    const e=document.createElement('div');e.className='day empty';grid.appendChild(e);
  }
  for(let d=1;d<=daysInMonth;d++){
    const date = new Date(y,m,d);
    const k = key(date);
    const el = document.createElement('div');
    el.className = 'day';
    el.innerHTML = `<span>${d}</span>`;

    if(MEMORIES[k]){
      el.classList.add('special');
      el.title = MEMORIES[k].title;
      el.innerHTML += `<span class="dot">• • •</span>`;
      el.addEventListener('click',()=>openViewModal(k));
    }
    if(date.toDateString()===today.toDateString()) el.classList.add('today');
    grid.appendChild(el);
  }
}

/* ============================================================
   MODALS & VIEWER
============================================================ */
function openViewModal(k){
  const m = MEMORIES[k];
  if(!m) return;
  const d = new Date(k);
  const pretty = d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  document.getElementById('cardDate').textContent = pretty;
  document.getElementById('cardTitle').textContent = m.title;
  document.getElementById('memory').textContent = m.memory;
  const gal = document.getElementById('gallery');
  gal.innerHTML = '';
  m.photos.forEach(p=>{
    const img=document.createElement('img');
    img.src=p;img.alt=m.title;img.loading='lazy';
    gal.appendChild(img);
  });
  document.getElementById('viewModal').classList.add('open');
}

function closeModal(id){
  document.getElementById(id).classList.remove('open');
}

document.getElementById('viewModal').onclick = (e)=>{
  if(e.target.id==='viewModal') closeModal('viewModal');
};
document.getElementById('editorModal').onclick = (e)=>{
  if(e.target.id==='editorModal') closeModal('editorModal');
};
document.getElementById('roomModal').onclick = (e)=>{
  if(e.target.id==='roomModal') closeModal('roomModal');
};

/* ============================================================
   EDITOR LOGIC & IMAGE COMPRESSION
============================================================ */
document.getElementById('openEditor').onclick = () => {
  renderMemList();
  document.getElementById('editorModal').classList.add('open');
};

function compressImage(file, maxWidth = 800, quality = 0.7) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = (height * maxWidth) / width;
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

let pendingPhotos = [];
document.getElementById('editPhotos').onchange = async (e) => {
  const files = Array.from(e.target.files);
  pendingPhotos = [];
  for (let file of files) {
    const compressed = await compressImage(file);
    pendingPhotos.push(compressed);
  }
  e.target.value = '';
};

document.getElementById('saveMemory').onclick = () => {
  const dateVal = document.getElementById('editDate').value;
  const title = document.getElementById('editTitle').value.trim();
  const memory = document.getElementById('editMemory').value.trim();

  if (!dateVal || !title) {
    alert("Please add at least a date and a title!");
    return;
  }

  if (MEMORIES[dateVal]) {
    MEMORIES[dateVal].title = title;
    MEMORIES[dateVal].memory = memory;
    MEMORIES[dateVal].photos = [...MEMORIES[dateVal].photos, ...pendingPhotos];
  } else {
    MEMORIES[dateVal] = {
      title: title,
      memory: memory,
      photos: [...pendingPhotos]
    };
  }

  saveData();
  render();
  renderMemList();
  
  document.getElementById('editDate').value = '';
  document.getElementById('editTitle').value = '';
  document.getElementById('editMemory').value = '';
  pendingPhotos = [];
  
  alert("Memory saved beautifully! 💕");
};

function renderMemList() {
  const list = document.getElementById('memList');
  list.innerHTML = '';
  const sortedKeys = Object.keys(MEMORIES).sort();
  
  if (sortedKeys.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:var(--ink-soft);font-style:italic">No memories added yet.</p>';
    return;
  }

  sortedKeys.forEach(k => {
    const m = MEMORIES[k];
    const d = new Date(k);
    const pretty = d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    
    const item = document.createElement('div');
    item.className = 'mem-item';
    item.innerHTML = `
      <div class="mem-item-info">
        <b>${m.title}</b>
        <span>${pretty} • ${m.photos.length} photo(s)</span>
      </div>
      <button class="del-btn" title="Delete">🗑️</button>
    `;
    item.querySelector('.del-btn').onclick = () => {
      if(confirm(`Delete "${m.title}"? This cannot be undone.`)) {
        delete MEMORIES[k];
        saveData();
        render();
        renderMemList();
      }
    };
    list.appendChild(item);
  });
}

function exportData() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(MEMORIES, null, 2));
  const downloadAnchorNode = document.createElement('a');
  downloadAnchorNode.setAttribute("href", dataStr);
  downloadAnchorNode.setAttribute("download", "our_memories_backup.json");
  document.body.appendChild(downloadAnchorNode);
  downloadAnchorNode.click();
  downloadAnchorNode.remove();
}

/* ============================================================
   MAP & REAL-TIME LOCATION FEATURES
============================================================ */
function initMap() {
  map = L.map('map').setView([20, 0], 2);
  
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);
}

function createHeartIcon(color, label) {
  return L.divIcon({
    className: 'custom-heart-icon',
    html: `<div style="text-align:center">
             <div style="font-size:32px;color:${color};text-shadow:0 2px 8px rgba(0,0,0,.3);">♥</div>
             <div style="font-size:11px;color:${color};font-weight:600;margin-top:-4px;text-shadow:0 1px 3px rgba(255,255,255,.9);">${label}</div>
           </div>`,
    iconSize: [40, 40],
    iconAnchor: [20, 20]
  });
}

function updateMap(myLoc, partnerLoc) {
  if (!map) return;
  
  if (myMarker) map.removeLayer(myMarker);
  if (partnerMarker) map.removeLayer(partnerMarker);
  if (distanceLine) map.removeLayer(distanceLine);
  
  const locations = [];
  
  if (myLoc) {
    myMarker = L.marker([myLoc.lat, myLoc.lng], {
      icon: createHeartIcon('#8B0000', userName)
    }).addTo(map).bindPopup(`<b>${userName}</b><br>Your location `);
    locations.push([myLoc.lat, myLoc.lng]);
  }
  
  if (partnerLoc) {
    partnerMarker = L.marker([partnerLoc.lat, partnerLoc.lng], {
      icon: createHeartIcon('#D32F2F', partnerLoc.name || 'My Love')
    }).addTo(map).bindPopup(`<b>${partnerLoc.name || 'My Love'}</b><br>Partner's location `);
    locations.push([partnerLoc.lat, partnerLoc.lng]);
  }
  
  if (locations.length === 2) {
    distanceLine = L.polyline(locations, {
      color: '#D32F2F',
      weight: 3,
      opacity: 0.6,
      dashArray: '10, 10'
    }).addTo(map);
    
    map.fitBounds(locations, { padding: [50, 50] });
    calculateDistance(myLoc, partnerLoc);
  } else if (locations.length === 1) {
    map.setView(locations[0], 13);
  }
  
  updateLocationInfo(myLoc, partnerLoc);
}

function calculateDistance(myLoc, partnerLoc) {
  if (!myLoc || !partnerLoc) {
    document.getElementById('distanceValue').textContent = '--';
    document.getElementById('distanceUnit').textContent = '';
    return;
  }
  
  const R = 6371;
  const dLat = (partnerLoc.lat - myLoc.lat) * Math.PI / 180;
  const dLon = (partnerLoc.lng - myLoc.lng) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(myLoc.lat * Math.PI / 180) * Math.cos(partnerLoc.lat * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  const distance = R * c;
  
  let displayDistance, unit;
  if (distance < 1) {
    displayDistance = (distance * 1000).toFixed(0);
    unit = 'meters';
  } else if (distance < 100) {
    displayDistance = distance.toFixed(1);
    unit = 'km';
  } else {
    displayDistance = distance.toFixed(0);
    unit = 'km';
  }
  
  document.getElementById('distanceValue').textContent = displayDistance;
  document.getElementById('distanceUnit').textContent = unit;
}

function updateLocationInfo(myLoc, partnerLoc) {
  const info = document.getElementById('locationInfo');
  
  if (!currentRoom) {
    info.innerHTML = 'Join a love room to track each other in real-time 💕';
    return;
  }
  
  if (!myLoc && !partnerLoc) {
    info.innerHTML = '<span class="status-indicator status-offline"></span>Waiting for locations...';
  } else if (myLoc && !partnerLoc) {
    info.innerHTML = `<span class="status-indicator status-online"></span><b>${userName}:</b> Online ✓<br>Waiting for partner to join 💕`;
  } else if (!myLoc && partnerLoc) {
    info.innerHTML = `<span class="status-indicator status-online"></span><b>${partnerLoc.name || 'Partner'}:</b> Online ✓<br>Share your location 💕`;
  } else {
    info.innerHTML = '<span class="status-indicator status-online"></span>Both hearts are connected 💕<br>Locations update automatically!';
  }
}

/* ============================================================
   ROOM & LOCATION TRACKING
============================================================ */
document.getElementById('joinRoom').onclick = () => {
  document.getElementById('roomModal').classList.add('open');
};

document.getElementById('joinRoomBtn').onclick = () => {
  const roomCode = document.getElementById('roomCodeInput').value.trim().toUpperCase();
  const name = document.getElementById('userNameInput').value.trim() || 'Me';
  
  if (!roomCode) {
    alert('Please enter a room code');
    return;
  }
  
  currentRoom = roomCode;
  userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  userName = name;
  
  localStorage.setItem('currentRoom', JSON.stringify({
    room: currentRoom,
    userId: userId,
    userName: userName
  }));
  
  closeModal('roomModal');
  startLocationTracking();
};

document.getElementById('shareRoomCode').onclick = () => {
  if (!currentRoom) {
    alert('Join a room first!');
    return;
  }
  
  const code = currentRoom;
  if (navigator.share) {
    navigator.share({
      title: 'Join Our Love Room 💕',
      text: `Join our love room with code: ${code}`,
    }).catch(() => {
      prompt('Share this room code with your partner:', code);
    });
  } else {
    prompt('Share this room code with your partner:', code);
  }
};

function startLocationTracking() {
  if (!navigator.geolocation) {
    alert('Geolocation is not supported by your browser');
    return;
  }
  
  const info = document.getElementById('locationInfo');
  info.innerHTML = '<span class="status-indicator status-online"></span>Getting your location...';
  
  // Watch position for real-time updates
  watchId = navigator.geolocation.watchPosition(
    (position) => {
      const myLoc = {
        lat: position.coords.latitude,
        lng: position.coords.longitude,
        name: userName,
        timestamp: Date.now()
      };
      
      // Update Firebase
      db.ref(`rooms/${currentRoom}/users/${userId}`).set(myLoc);
      
      updateMap(myLoc, lastPartnerLoc);
    },
    (error) => {
      console.error('Geolocation error:', error);
      info.innerHTML = '⚠️ Unable to get location. Please enable location services.';
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
  
  // Listen for partner's location
  db.ref(`rooms/${currentRoom}/users`).on('value', (snapshot) => {
    const users = snapshot.val();
    if (!users) return;
    
    const userIds = Object.keys(users);
    const partnerId = userIds.find(id => id !== userId);
    
    if (partnerId && users[partnerId]) {
      lastPartnerLoc = users[partnerId];
      const myLoc = users[userId];
      updateMap(myLoc, lastPartnerLoc);
    }
  });
}

// Clean up when leaving page
window.addEventListener('beforeunload', () => {
  if (watchId) {
    navigator.geolocation.clearWatch(watchId);
  }
  if (currentRoom && userId) {
    db.ref(`rooms/${currentRoom}/users/${userId}`).remove();
  }
});

   INITIALIZATION
============================================================ */
document.getElementById('prev').onclick = ()=>{viewDate.setMonth(viewDate.getMonth()-1);render()};
document.getElementById('next').onclick = ()=>{viewDate.setMonth(viewDate.getMonth()+1);render()};

function updateCounter(){
  const start = new Date(RELATIONSHIP_START);
  const diff = Math.floor((today - start)/(1000*60*60*24));
  document.getElementById('daysCount').textContent = diff>0?diff:0;
}

function spawnHearts(){
  const box = document.getElementById('hearts');
  const symbols = ['♥','♡','❤'];
  for(let i=0;i<18;i++){
    const s = document.createElement('span');
    s.textContent = symbols[i%symbols.length];
    s.style.left = Math.random()*100+'vw';
    s.style.fontSize = (10+Math.random()*18)+'px';
    s.style.animationDuration = (8+Math.random()*10)+'s';
    s.style.animationDelay = (Math.random()*10)+'s';
    box.appendChild(s);
  }
}

// Boot up when DOM is ready
document.addEventListener('DOMContentLoaded', () => {
  loadData();
  render();
  updateCounter();
  spawnHearts();
  initMap();
});
